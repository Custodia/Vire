<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vire — Readiness</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0D1012}
a{color:#B7F36B}a:hover{color:#D4FA9F}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#A0A9B1;font-weight:600}
.num{font-family:'Barlow Condensed',Inter,sans-serif;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.card{background:#161A1E;border:1px solid #252B31;border-radius:18px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:48px;font-size:11px;font-weight:600;color:#A0A9B1;text-decoration:none}
.tab:hover{color:#EEF1F3}
</style>
</helmet>
<div style="width: 390px; height: 1180px; position: relative; box-sizing: border-box; background: #0D1012; color: #EEF1F3; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <div style="padding: 20px 20px 110px; display: flex; flex-direction: column; gap: 14px">

    <header style="display: flex; flex-direction: column; gap: 4px; padding-top: 12px">
      <span class="lbl">Fri 23 Oct · Garmin sync 06:05</span>
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Readiness</h1>
    </header>

    <section class="card" style="padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: flex-start">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span class="lbl">Overnight HRV</span>
          <span><span class="num" style="font-size: 44px; line-height: 1">63</span><span style="font-size: 14px; color: #A0A9B1"> ms</span></span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
          <span style="font-size: 12px; font-weight: 600; color: #FFB27A; background: #2A1E14; padding: 5px 10px; border-radius: 999px">Below band · 3 nights</span>
          <span style="font-size: 12px; color: #A0A9B1">7-day avg <span class="num" style="font-size: 15px; color: #EEF1F3">64</span></span>
        </div>
      </div>

      <div role="img" aria-label="HRV over the last 28 nights against a balanced band of 65 to 79 milliseconds; the last three nights fall below the band" style="position: relative; height: 150px; margin-left: 26px">
        <div style="position: absolute; left: 0; right: 0; top: 45px; height: 45px; background: #1E3446; border-radius: 4px"></div>
        <div class="num" style="position: absolute; left: -26px; top: 37px; font-size: 12px; color: #A0A9B1">79</div>
        <div class="num" style="position: absolute; left: -26px; top: 82px; font-size: 12px; color: #A0A9B1">65</div>
        <sc-for list="{{dots}}" as="d" hint-placeholder-count="28">
          <div style="{{d.style}}"></div>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 11px; color: #A0A9B1; margin-left: 26px">
        <span>26 Sep</span><span>9 Oct</span><span>23 Oct</span>
      </div>
      <div style="display: flex; gap: 16px; font-size: 12px; color: #A0A9B1">
        <span style="display: inline-flex; align-items: center; gap: 6px"><svg width="10" height="10" aria-hidden="true"><rect width="10" height="10" rx="2" fill="#1E3446"></rect></svg>Balanced band</span>
        <span style="display: inline-flex; align-items: center; gap: 6px"><svg width="10" height="10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="#C7D0D8"></circle></svg>In band</span>
        <span style="display: inline-flex; align-items: center; gap: 6px"><svg width="10" height="10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="#FFB27A"></circle></svg>Below</span>
      </div>
    </section>

    <section class="card" style="overflow: hidden">
      <sc-for list="{{metrics}}" as="m" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 12px; padding: 13px 18px; border-bottom: 1px solid #22282E">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px; font-weight: 600">{{m.name}}</span>
            <span style="font-size: 12px; color: #A0A9B1">{{m.base}}</span>
          </div>
          <span class="num" style="font-size: 22px">{{m.value}}</span>
          <span style="{{m.flagStyle}}">{{m.flag}}</span>
        </div>
      </sc-for>
    </section>

  </div>

  <nav aria-label="Primary" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 6px 8px 22px; background: #111518; border-top: 1px solid #252B31; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>Today
    </a>
    <a href="Block.dc.html" class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Plan
    </a>
    <a href="Readiness.dc.html" class="tab" aria-current="page" style="color: #B7F36B">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2-5 4 10 2-5h6"></path></svg>Readiness
    </a>
    <a href="Nutrition.dc.html" class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20c4-1 7-4 8-9M12 11c1-3 4-6 8-7-1 4-4 7-8 7zM12 11C10 8 7 7 4 7c0 3 2 6 8 4"></path></svg>Nutrition
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const hrv = [72, 70, 74, 68, 71, 75, 73, 69, null, 72, 76, 70, 68, 71, 67, 73, 66, null, null, 70, 68, 67, 64, 66, 65, 62, 61, 63];
    const top = 92, bottom = 48, h = 150;
    const dots = [];
    hrv.forEach((v, i) => {
      if (v === null) return;
      const y = Math.round((top - v) / (top - bottom) * (h - 10));
      const x = (i / (hrv.length - 1) * 100).toFixed(2);
      const below = v < 65;
      dots.push({ style: 'position: absolute; left: calc(' + x + '% - 4px); top: ' + y + 'px; width: 9px; height: 9px; border-radius: 50%; background: ' + (below ? '#FFB27A' : '#C7D0D8') });
    });
    const flag = (kind) => kind === 'warn'
      ? 'width: 58px; text-align: right; font-size: 12px; font-weight: 600; color: #FFB27A'
      : 'width: 58px; text-align: right; font-size: 12px; font-weight: 600; color: #A0A9B1';
    const metrics = [
      { name: 'Sleep', base: '7-day avg 6:58 · score 78', value: '7:12', flag: 'Normal', flagStyle: flag() },
      { name: 'Resting HR', base: 'Baseline 47 bpm', value: '49', flag: '+2', flagStyle: flag('warn') },
      { name: 'Stress', base: 'Yesterday avg · baseline 27', value: '31', flag: 'Raised', flagStyle: flag('warn') },
      { name: 'Body Battery', base: 'At wake · 7-day avg 70', value: '72', flag: 'Normal', flagStyle: flag() },
      { name: 'Training load', base: 'Acute 61 · chronic 54', value: '1.13', flag: 'Building', flagStyle: flag() },
      { name: 'Energy balance', base: '7-day avg from MacroFactor', value: '−480', flag: 'kcal/d', flagStyle: flag() }
    ];
    return { dots, metrics };
  }
}
</script>
</body>
</html>
